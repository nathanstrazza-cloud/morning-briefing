name: Morning Briefing

on:
  schedule:
    - cron: "30 4 * * 1-5"   # été (mars-octobre environ)
    - cron: "30 5 * * 1-5"   # hiver (novembre-mars environ)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération du briefing
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Commit et push des données générées
        run: |
          git config user.name "morning-briefing-bot"
          git config user.email "actions@github.com"
          git add docs/data/ logs/
          git diff --staged --quiet || git commit -m "Briefing du $(date +'%Y-%m-%d %H:%M') (Europe/Paris)"
          git push
