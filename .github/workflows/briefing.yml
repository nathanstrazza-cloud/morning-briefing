name: Morning Briefing

# Déclenchement principal : appel externe (ex. cron-job.org) sur l'API
# workflow_dispatch à ~06:10 Paris -- voir README, section "Déclenchement".
# Le "schedule" natif de GitHub Actions est documenté comme best-effort et a été
# observé avec des retards de 4 à 6h sur ce dépôt (cf. logs 2026-09-22/23/24), quelle
# que soit la minute choisie -- il ne peut donc pas garantir une publication à 06h30.
# On le garde uniquement comme FILET DE SÉCURITÉ tardif si le déclenchement externe
# échoue un jour. Le garde-fou d'idempotence dans src/main.py (day_briefing_exists)
# empêche toute double génération, quel que soit le nombre de déclenchements reçus.
on:
  schedule:
    - cron: "0 7 * * 1-5"   # filet de sécurité tardif (~09h Paris été / 08h hiver)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération du briefing
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Commit et push des données générées
        run: |
          git config user.name "morning-briefing-bot"
          git config user.email "actions@github.com"
          git add docs/data/ logs/
          git diff --staged --quiet || git commit -m "Briefing du $(date +'%Y-%m-%d %H:%M') (Europe/Paris)"
          git push
