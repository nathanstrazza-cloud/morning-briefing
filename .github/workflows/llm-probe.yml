name: LLM probe

# Sonde manuelle : requête à 1 token sur Groq, Mistral, OpenRouter, NVIDIA + relevé des limites.
# Lancement : onglet Actions > "LLM probe" > Run workflow. Ne publie pas le site ; commit seulement
# logs/llm_probe.txt et logs/llm_probe.json (limites + codes HTTP, JAMAIS de clé : cf. _scrub()).
# Voir scripts/llm_probe.py et docs de handoff (HANDOFF_LLM.md).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sonde des fournisseurs LLM
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          python scripts/llm_probe.py --json probe.json | tee probe.txt
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit du résultat (lisible par une autre IA / l'utilisateur)
        run: |
          mkdir -p logs
          cp probe.txt logs/llm_probe.txt
          cp probe.json logs/llm_probe.json
          git config user.name "morning-briefing-bot"
          git config user.email "actions@github.com"
          git add logs/llm_probe.txt logs/llm_probe.json
          git diff --staged --quiet || git commit -m "Résultat de la sonde LLM"
          git pull -q --rebase && git push
