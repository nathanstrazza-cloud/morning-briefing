# Configuration centrale du Morning Briefing
# Toute source ajoutée/retirée se fait ici, pas dans le code (cf. cahier §24 évolutivité).

timezone: "Europe/Paris"

seuils:
  score_min_affichage: 5   # cf. cahier §13 : <5 généralement ignoré
  score_min_marche_pct: 1.0  # variation (%) en dessous de laquelle un indice n'est pas commenté
  # NB (2026-09-19, demande explicite de l'utilisateur) : 5 informations France + 5 Monde
  # suffisent largement -- cf. cahier §1 "mieux vaut 5 informations réellement importantes
  # que 20 secondaires". Réduit aussi mécaniquement la taille du prompt envoyé au LLM
  # (cf. src/generation/briefing_generator.py, garde-fou anti-413).
  max_actualites_par_zone: 5   # valeur par défaut, utilisée si la clé propre à la zone est absente
  # NB (2026-10-10, demande de l'utilisateur) : plafond Monde levé (8). Le Monde a plus de matière que la France
  # (zones.py y reclasse ~20 items par jour) ; le vrai filtre reste le seuil de score (score_min_affichage) et la
  # diversité (2 événements max par sujet). France inchangée.
  max_actualites_france: 5
  max_actualites_monde: 8
  # NB (2026-09-24, demande explicite de l'utilisateur) : 3 ou 4 infos sport suffisent au
  # total (toutes catégories confondues), au lieu de jusqu'à 20 (5 par catégorie x 4
  # catégories). cf. src/main.py, réduction globale après le plafond par catégorie.
  max_sport_total: 4

# ---------------------------------------------------------------------------
# ACTUALITÉ — flux RSS gratuits, aucune clé nécessaire.
# Ajouter/retirer une source ici suffit ; rss_sources.py ne connaît pas les URLs en dur.
# ---------------------------------------------------------------------------
rss:
  france:
    - name: "Le Monde"
      url: "https://www.lemonde.fr/rss/une.xml"
    - name: "France Info"
      url: "https://www.francetvinfo.fr/titres.rss"
    # NB (2026-09-20) : "AFP (via Le Point)" (lepoint.fr) retiré -- HTTP 403 persistant même
    # avec un User-Agent de navigateur (cf. rss_sources.py), signe d'une protection anti-bot
    # plus poussée que ce qu'un simple en-tête peut contourner (hors scope V1, cf. cahier
    # §19 coût 0€ : pas de service de contournement payant). Remplacé par deux sources
    # généralistes gratuites réputées fiables pour leur flux RSS public.
    - name: "Libération"
      url: "https://www.liberation.fr/arc/outboundfeeds/rss/"
    - name: "20 Minutes"
      url: "https://www.20minutes.fr/feeds/rss-une.xml"
  monde:
    - name: "Le Monde International"
      url: "https://www.lemonde.fr/international/rss_full.xml"
    - name: "New York Times World"
      url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    - name: "France 24 International"
      url: "https://www.france24.com/fr/rss"
  economie:
    - name: "Le Monde Économie"
      url: "https://www.lemonde.fr/economie/rss_full.xml"
    # NB (2026-09-20, 2e itération) : "Les Echos Une" retiré (HTTP 403 persistant, cf. plus
    # haut). Première tentative de remplacement (Capital, BFM Business avec un mauvais
    # chemin) : les deux en HTTP 404 -- mauvaises URLs, corrigées ci-dessous et à
    # reconfirmer par un run réel (ce sandbox ne peut pas atteindre ces domaines pour
    # tester directement, cf. rss_sources.py).
    - name: "Le Figaro Économie"
      url: "https://www.lefigaro.fr/rss/figaro_economie.xml"
    - name: "BFM Business"
      url: "https://www.bfmtv.com/rss/economie/"
  sciences:
    - name: "Le Monde Sciences"
      url: "https://www.lemonde.fr/sciences/rss_full.xml"
    - name: "CNRS Actualités"
      url: "https://www.cnrs.fr/fr/rss.xml"
    - name: "Nature News"
      url: "https://www.nature.com/nature.rss"

# ---------------------------------------------------------------------------
# SPORT — refonte généraliste du 05/10/2026 : TOUS les sports, aucune préférence utilisateur (plus de
# Spurs, plus de filtre « équipe de France », plus de liste fixe de sports). Chaque flux est collecté,
# le sport de chaque article est détecté (indice `sport` du flux si présent, sinon mots-clés, cf.
# src/analyse/sport_scoring.py), puis l'importance décide : max `max_par_sport` par sport, max_sport_total
# au total (cf. seuils). Ajouter un sport = ajouter un flux ici. Flux marqués « NON VÉRIFIÉ » : jamais
# testés depuis le sandbox (pas d'accès réseau) ; en cas d'échec, status.json/sources_rss_en_erreur le
# montre et le pipeline continue avec les autres.
# ---------------------------------------------------------------------------
sport:
  max_par_sport: 2
  sources:
    - {name: "L'Équipe Football", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Football", sport: "football"}
    - {name: "L'Équipe Basket", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Basket", sport: "basketball"}
    - {name: "L'Équipe Tennis", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Tennis", sport: "tennis"}
    - {name: "L'Équipe Rugby", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Rugby", sport: "rugby"}
    - {name: "L'Équipe Cyclisme", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Cyclisme", sport: "cyclisme"}
    - {name: "L'Équipe Hand", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Hand", sport: "handball"}
    - {name: "L'Équipe Volley", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Volley", sport: "volley-ball"}
    - {name: "L'Équipe Natation", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Natation", sport: "natation"}
    # NON VÉRIFIÉ : chemins L'Équipe supposés sur le même modèle que ci-dessus.
    - {name: "L'Équipe Athlétisme", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Athletisme", sport: "athlétisme"}
    - {name: "L'Équipe Formule 1", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Formule-1", sport: "formule 1"}
    - {name: "L'Équipe Golf", url: "https://dwh.lequipe.fr/api/edito/rss?path=/Golf", sport: "golf"}
    # Flux généralistes internationaux (sport détecté par mots-clés, titres en anglais traduits par le LLM).
    - {name: "ESPN NBA News", url: "https://www.espn.com/espn/rss/nba/news", sport: "basketball"}
    - {name: "ESPN Top Headlines", url: "https://www.espn.com/espn/rss/news"}              # NON VÉRIFIÉ
    - {name: "BBC Sport", url: "https://feeds.bbci.co.uk/sport/rss.xml"}                   # NON VÉRIFIÉ

# ---------------------------------------------------------------------------
# CALENDRIER SPORT (03/10/2026, neutralisé le 05/10) — « prochaines affiches » affichées quand aucune actualité
# sportive n'est retenue (décision utilisateur du 01/10). API publique ESPN (gratuite, sans
# clé) : https://site.api.espn.com/apis/site/v2/sports/<sport>/<slug>/scoreboard?dates=AAAAMMJJ-AAAAMMJJ
# PAS ENCORE vérifié en réel (aucun accès réseau depuis le sandbox de développement) : en cas d'échec
# ou de réponse vide, le briefing dit simplement « rien d'intéressant » SANS prochain match (jamais
# inventé). Corriger les `slug` ici si un Dev Test montre « calendrier: 0 match ».
# ---------------------------------------------------------------------------
calendrier:
  fenetre_jours: 14
  football:
    - {slug: "fra.1", sport: "soccer", label: "Ligue 1", rang_base: 5}
    - {slug: "uefa.champions", sport: "soccer", label: "Ligue des champions", rang_base: 3}
    - {slug: "uefa.europa", sport: "soccer", label: "Europa League", rang_base: 4}
    - {slug: "fifa.friendly", sport: "soccer", label: "Match amical", rang_base: 9}
    - {slug: "uefa.nations", sport: "soccer", label: "Ligue des nations", rang_base: 9}
    - {slug: "fifa.worldq.uefa", sport: "soccer", label: "Qualifications Coupe du monde", rang_base: 9}
  # Facultatif : équipe nationale dont les matchs passent avant tout. Vide = aucune préférence (défaut).
  equipe_nationale: ""
  # Clubs français « phares » : un match qui en oppose deux est l'affiche par excellence.
  clubs_phares: ["Paris Saint-Germain", "Real Madrid", "Barcelona", "Manchester City", "Liverpool", "Bayern", "Arsenal", "Inter", "Juventus", "Marseille"]
  basketball:
    - {slug: "nba", sport: "basketball", label: "NBA"}
  # Franchises « phares » (affiche prioritaire), neutre : liste de grandes franchises, pas une préférence utilisateur.
  franchises_phares: ["Lakers", "Warriors", "Celtics", "Knicks", "Bucks", "Nuggets", "Heat"]

# ---------------------------------------------------------------------------
# MARCHÉS — Yahoo Finance (endpoint "chart" public, gratuit, aucune clé)
# symboles Yahoo Finance : cherchable sur https://finance.yahoo.com/lookup
# (corrigé le 2026-09-13, remplace Stooq qui exige désormais une clé via CAPTCHA
# depuis avril 2026, cf. src/collecte/markets.py pour le détail)
# ---------------------------------------------------------------------------
marches:
  indices:
    - {name: "CAC 40", symbol: "^FCHI"}
    - {name: "S&P 500", symbol: "^GSPC"}
    - {name: "Nasdaq", symbol: "^IXIC"}
    - {name: "DAX", symbol: "^GDAXI"}
    - {name: "Euro Stoxx 50", symbol: "^STOXX50E"}
  matieres_premieres:
    - {name: "Pétrole (Brent)", symbol: "BZ=F"}
    - {name: "Or", symbol: "GC=F"}

# ---------------------------------------------------------------------------
# MÉTÉO — Open-Meteo (gratuit, sans clé)
# ---------------------------------------------------------------------------
meteo:
  villes:
    - {name: "Antibes", lat: 43.5808, lon: 7.1251}
    - {name: "Cannes", lat: 43.5528, lon: 7.0174}
    - {name: "Valbonne", lat: 43.6392, lon: 7.0122}
    - {name: "Grasse", lat: 43.6584, lon: 6.9227}

# ---------------------------------------------------------------------------
# SOURCES "MAISON" DEMANDÉES DANS LE CAHIER (§10) — utilisées quand pertinent,
# le système n'est PAS limité à cette liste.
# ---------------------------------------------------------------------------
sources_preferees:
  - "Le Monde"
  - "L'Équipe"
  - "The New York Times"

# ---------------------------------------------------------------------------
# LLM — voir README §4 pour les secrets associés
# ---------------------------------------------------------------------------
llm:
  provider_env_var: "LLM_PROVIDER"   # groq | gemini | anthropic
  temperature: 0.3
  langue: "fr"
